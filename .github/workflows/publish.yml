name: Publish Docker image

# On-demand only: manual dispatch publishes a SHA-tagged image; pushing a
# release tag (v*) publishes a version-tagged image. Never runs on PRs.
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  # A release tag must match the version stamped into the bridge's startup
  # banner, which comes from CMakeLists.txt; package.xml must agree with it.
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against CMakeLists.txt and package.xml
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(sed -nE 's/^project\(foxglove_bridge .*VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)
          PACKAGE_VERSION=$(sed -nE 's|.*<version>(.*)</version>.*|\1|p' package.xml)
          echo "tag: ${TAG_VERSION}, CMakeLists.txt: ${CMAKE_VERSION}, package.xml: ${PACKAGE_VERSION}"

          if [[ "${TAG_VERSION}" != "${CMAKE_VERSION}" || "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt (${CMAKE_VERSION}) and package.xml (${PACKAGE_VERSION})"
            exit 1
          fi

  # CI only runs on main and PRs, so a tag may point at an untested commit.
  ci:
    uses: ./.github/workflows/ci.yml

  # Each architecture pushes its image by digest only; the merge job then
  # publishes one multi-arch tag over both digests.
  build:
    name: build (${{ matrix.arch }})
    needs: [check-version, ci]
    # check-version is skipped on manual dispatch; without always() that skip
    # would cascade and skip this job too.
    if: ${{ always() && needs.ci.result == 'success' && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Stage 1 of the Dockerfile builds Noetic from source, which dominates the
    # runtime on a cold cache; cap the job well below the 6-hour default so a
    # hung build fails fast.
    timeout-minutes: 120
    env:
      # The ros-noetic-* tag namespace here sits alongside the ROS 2 distro
      # tags published by foxglove-sdk's publish-ros-bridge.yml.
      DOCKER_REPO: us-central1-docker.pkg.dev/foxglove-images/images/foxglove_bridge

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Auth gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PUBLISHER_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure gcloud docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # .dockerignore keeps .git out of the build context, so the hash for the
      # bridge's startup banner must be passed in (same as the Makefile does).
      - name: Compute git hash
        id: compute-git-hash
        run: echo "hash=$(git describe --always --dirty --exclude='*')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            FOXGLOVE_BRIDGE_GIT_HASH=${{ steps.compute-git-hash.outputs.hash }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          # Same per-arch scopes as ci.yml, so the Noetic stage is reused.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    # The skipped check-version upstream would otherwise skip this job too.
    # The matrix job's result is success only if every architecture succeeded.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKER_REPO: us-central1-docker.pkg.dev/foxglove-images/images/foxglove_bridge

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Auth gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PUBLISHER_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure gcloud docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Compute image tag
        id: compute-tag
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "Using release version: ${VERSION}"
          else
            VERSION="${GITHUB_SHA}"
            echo "Using SHA version: ${VERSION}"
          fi

          echo "tag=${DOCKER_REPO}:ros-noetic-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do sources+=("${DOCKER_REPO}@sha256:${digest}"); done
          docker buildx imagetools create -t "${{ steps.compute-tag.outputs.tag }}" "${sources[@]}"
          docker buildx imagetools inspect "${{ steps.compute-tag.outputs.tag }}"

      - name: Show summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Image published

          - \`${{ steps.compute-tag.outputs.tag }}\` (linux/amd64, linux/arm64)
          EOF
