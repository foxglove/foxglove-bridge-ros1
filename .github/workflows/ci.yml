name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets publish.yml gate an image push on lint and the smoke suite.
  workflow_call: {}

# Superseded runs are pointless at this build's cost; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned runner: clang-format comes from the distro (18 on 24.04), and
    # formatting must be checked with the version the code was formatted with.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: make lint

  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Stage 1 of the Dockerfile builds Noetic from source, which dominates the
    # runtime on a cold cache; cap the job well below the 6-hour default so a
    # hung build fails fast.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image (bridge stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: bridge
          tags: foxglove-bridge-ros1-build
          load: true
          # Per-arch scopes keep the two architectures from evicting each
          # other's layers; publish.yml reads the same scopes.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Run the smoke suite
        run: make docker-test-run
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: foxglove-bridge-ros1
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Boot-check the runtime image
        run: |
          docker run --rm foxglove-bridge-ros1 bash -c "\
            roscore > /tmp/rc.log 2>&1 & sleep 5; \
            rosrun foxglove_bridge foxglove_bridge > /tmp/fb.log 2>&1 & sleep 6; \
            grep -q 'Server listening' /tmp/fb.log && rostopic list \
              || { cat /tmp/rc.log /tmp/fb.log; exit 1; }"
