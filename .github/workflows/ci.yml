name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Stage 1 of the Dockerfile builds Noetic from source, which dominates the
    # runtime on a cold cache; cap the job well below the 6-hour default so a
    # hung build fails fast.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run smoke tests
        run: make docker-test
